site_name: Security Documentation
site_description: Sanitized cybersecurity labs, research and project documentation
site_url: https://iazent.github.io/security-engineering-portfolio/
repo_url: https://github.com/IAZENT/security-engineering-portfolio
repo_name: IAZENT/security-engineering-portfolio
docs_dir: docs
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Penetration Testing:
      - Overview: pentesting/index.md
      - Pentest Finding: pentesting/finding-template.md
      - Security Assessment Reports: pentesting/reports/index.md
      - Reflected XSS Case Study: pentesting/reports/dvwa-reflected-xss-case-study.md
  - Walkthroughs: walkthroughs/index.md
  - Research: research/index.md
  - Projects: projects/index.md
